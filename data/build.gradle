plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id("com.google.devtools.ksp")
    id 'androidx.room'
}

android {
    compileSdk 36

    defaultConfig {
        minSdk 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    namespace 'info.sergeikolinichenko.data'

    room {
        schemaDirectory "$projectDir/schemas"
    }

    sourceSets {
        test.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {

    api project(path: ':domain')

    api ("androidx.room:room-runtime:2.7.2")
    implementation ("androidx.room:room-ktx:2.7.2")
    ksp ("androidx.room:room-compiler:2.7.2")

    implementation ("com.google.dagger:dagger:2.57")
    ksp ("com.google.dagger:dagger-compiler:2.57")

    api ("androidx.work:work-runtime-ktx:2.10.3")

    testImplementation ("junit:junit:4.13.2")
    testImplementation ("org.robolectric:robolectric:4.15.1")
    testImplementation ("androidx.test:core-ktx:1.7.0")
    testImplementation ("androidx.room:room-testing:2.7.2")
    testImplementation ("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
}
