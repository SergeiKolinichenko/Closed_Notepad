plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id("com.google.devtools.ksp")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def keystoreFile = localProperties.getProperty('KEYSTORE_FILE')
def hasReleaseKeystore = keystoreFile != null && file(keystoreFile).canRead()

android {
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreFile)
                keyAlias localProperties.getProperty('KEYSTORE_ALIAS')
                storePassword localProperties.getProperty('KEYSTORE_PASSWORD')
                keyPassword localProperties.getProperty('KEYSTORE_KEY_PASSWORD')
            }
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId "info.sergeikolinichenko.closednotepad"
        minSdk 23
        targetSdk 36
        versionCode 15
        versionName "3.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        compose true
    }
    namespace 'info.sergeikolinichenko.closednotepad'

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {

    implementation project(path: ':data')

    def composeBom = platform("androidx.compose:compose-bom:2025.07.00")
    implementation composeBom
    implementation ("androidx.compose.material3:material3")
    implementation ("androidx.compose.material:material-icons-extended")
    implementation ("androidx.compose.ui:ui")
    implementation ("androidx.compose.ui:ui-tooling-preview")
    debugImplementation ("androidx.compose.ui:ui-tooling")

    implementation ("androidx.core:core-ktx:1.16.0")
    implementation ("androidx.activity:activity-compose:1.10.1")
    implementation ("androidx.fragment:fragment-ktx:1.8.8")
    implementation ("androidx.navigation:navigation-compose:2.9.2")
    implementation ("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2")
    implementation ("androidx.lifecycle:lifecycle-runtime-compose:2.9.2")
    implementation ("androidx.lifecycle:lifecycle-process:2.9.2")
    implementation ("sh.calvin.reorderable:reorderable:2.4.3")

    implementation ("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")

    implementation ("androidx.biometric:biometric:1.1.0")

    implementation ("com.google.dagger:dagger:2.57")
    ksp ("com.google.dagger:dagger-compiler:2.57")

    implementation ("androidx.work:work-runtime-ktx:2.10.3")

    testImplementation ("junit:junit:4.13.2")
    testImplementation ("org.robolectric:robolectric:4.15.1")
    testImplementation ("androidx.compose.ui:ui-test-junit4")
    debugImplementation ("androidx.compose.ui:ui-test-manifest")
}
